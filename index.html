<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Productivity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="currency-box box">
            <div class="box-title">JC</div>
            <div id="currency">0.0</div>
        </section>

        <section class="tasks-box box">
            <div class="box-title">Daily Tasks</div>

            <div id="task-list" class="task-list">
                <!-- Tasks are generated by JavaScript -->
            </div>
        </section>

        <section class="wip-box box">
            <div class="box-title">Reading</div>
            <div class="wip-text">WIP: reading</div>
        </section>

        <section class="wip-box box">
            <div class="box-title">Shop</div>
            <div class="wip-text">WIP: shop</div>
        </section>

        <section class="wip-box box">
            <div class="box-title">Collection</div>
            <div class="wip-text">WIP: Collection</div>
        </section>
    </main>

    <script src="java.js"></script>
</body>
</html>
