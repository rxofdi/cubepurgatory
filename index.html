<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Productivity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">

        <!-- Currency -->
        <section class="currency-box box">
            <div class="box-title">JC</div>
            <div id="currency">0.0</div>
        </section>

        <!-- Daily Tasks -->
        <section class="tasks-box box">
            <div class="box-title">Daily Tasks</div>

            <div id="task-list" class="task-list">
                <!-- Tasks are generated here by JavaScript -->
            </div>
        </section>

        <!-- WIP Sections -->
        <section class="wip-box box">
            <div class="wip-text">WIP: reading</div>
        </section>

        <section class="wip-box box">
            <div class="wip-text">WIP: shop</div>
        </section>

        <section class="wip-box box">
            <div class="wip-text">WIP: Collection</div>
        </section>

    </main>

    <script>
        // ==========================
        // JC PRODUCTIVITY SYSTEM
        // ==========================

        const CURRENCY_KEY = "johnCurrency";
        const TASKS_KEY = "dailyTasks";
        const COOLDOWNS_KEY = "taskCooldowns";

        const TASK_COUNT = 10;
        const TASK_REWARD = 0.5;
        const COOLDOWN_MS = 60 * 1000; // 1 minute

        // Load saved currency.
        let currency = Number(localStorage.getItem(CURRENCY_KEY)) || 0;

        // Load saved tasks, or make 10 default tasks.
        let tasks = JSON.parse(localStorage.getItem(TASKS_KEY)) || [];

        // Load saved cooldown times.
        let cooldowns = JSON.parse(localStorage.getItem(COOLDOWNS_KEY)) || {};

        function createDefaultTasks() {
            return Array.from({ length: TASK_COUNT }, (_, index) => ({
                id: index,
                text: "Task " + (index + 1)
            }));
        }

        function normalizeTasks() {
            const defaults = createDefaultTasks();

            if (!Array.isArray(tasks)) {
                tasks = defaults;
            }

            // Make sure there are always exactly 10 tasks.
            while (tasks.length < TASK_COUNT) {
                const index = tasks.length;
                tasks.push(defaults[index]);
            }

            tasks = tasks.slice(0, TASK_COUNT).map((task, index) => ({
                id: index,
                text: typeof task?.text === "string"
                    ? task.text
                    : "Task " + (index + 1)
            }));
        }

        function saveCurrency() {
            localStorage.setItem(CURRENCY_KEY, currency.toFixed(1));
        }

        function saveTasks() {
            localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
        }

        function saveCooldowns() {
            localStorage.setItem(COOLDOWNS_KEY, JSON.stringify(cooldowns));
        }

        function updateCurrencyDisplay() {
            document.getElementById("currency").textContent = currency.toFixed(1);
        }

        function isCoolingDown(taskId) {
            const cooldownEnd = Number(cooldowns[taskId]) || 0;
            return cooldownEnd > Date.now();
        }

        function getRemainingSeconds(taskId) {
            const cooldownEnd = Number(cooldowns[taskId]) || 0;

            return Math.max(
                0,
                Math.ceil((cooldownEnd - Date.now()) / 1000)
            );
        }

        function awardTask(taskId) {
            // Prevent rewarding the task while it is cooling down.
            if (isCoolingDown(taskId)) {
                return;
            }

            // Give 0.5 JC.
            currency += TASK_REWARD;

            // Keep currency at one decimal place.
            currency = Math.round(currency * 10) / 10;

            // Start this task's one-minute cooldown.
            cooldowns[taskId] = Date.now() + COOLDOWN_MS;

            // Save everything.
            saveCurrency();
            saveCooldowns();

            // Update the page.
            updateCurrencyDisplay();
            renderTasks();
        }

        function editTask(taskId, input) {
            const task = tasks.find(item => item.id === taskId);

            if (!task) {
                return;
            }

            task.text = input.value;
            saveTasks();
        }

        function renderTasks() {
            const taskList = document.getElementById("task-list");

            taskList.innerHTML = "";

            tasks.forEach(task => {
                const row = document.createElement("div");
                row.className = "task-row";

                // Checkbox
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = false;
                checkbox.disabled = isCoolingDown(task.id);

                checkbox.addEventListener("change", function () {
                    if (checkbox.checked) {
                        awardTask(task.id);
                    }
                });

                // Editable task text
                const input = document.createElement("input");

                input.type = "text";
                input.className = "task-text";
                input.value = task.text;
                input.setAttribute("aria-label", "Task " + (task.id + 1));

                input.addEventListener("input", function () {
                    editTask(task.id, input);
                });

                // Cooldown display
                const timer = document.createElement("span");
                timer.className = "cooldown-timer";

                if (isCoolingDown(task.id)) {
                    timer.textContent = getRemainingSeconds(task.id) + "s";
                }

                row.appendChild(checkbox);
                row.appendChild(input);
                row.appendChild(timer);

                taskList.appendChild(row);
            });
        }

        function updateCooldowns() {
            let changed = false;

            // Remove expired cooldowns.
            Object.keys(cooldowns).forEach(taskId => {
                if (!isCoolingDown(taskId)) {
                    delete cooldowns[taskId];
                    changed = true;
                }
            });

            if (changed) {
                saveCooldowns();
            }

            renderTasks();
        }

        // Initialize the app.
        normalizeTasks();
        saveTasks();
        updateCurrencyDisplay();
        renderTasks();

        // Keep cooldown timers updated.
        setInterval(updateCooldowns, 250);
    </script>
</body>
</html>
